<script>
(() => {
'use strict';
const SCRIPT_TEXT = document.currentScript ? document.currentScript.textContent : '';
// ============================================================ constants
const W = 180, H = 320, SURF = 84, SEABED = 300, NEED = 4, BX = 6, OUT = '#1b1b2f';
// Fight tuning (checked with a Monte-Carlo of play styles): holding through a dash must snap the line,
// random tapping must lose, and a player reacting to the "!" within ~0.4s should land most fish.
const REEL = 60, DASH_RATE = 180, JERK = 11;
const FONT = '"ZCOOL QingKe HuangYou","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif';
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const pick = a => a[Math.floor(Math.random() * a.length)];
const R = Math.round;
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

// ============================================================ pixel painter
class Grid {
  constructor(w, h) { this.w = w; this.h = h; this.d = new Array(w * h).fill(null); }
  set(x, y, c) { x |= 0; y |= 0; if (c && x >= 0 && y >= 0 && x < this.w && y < this.h) this.d[y * this.w + x] = c; }
  get(x, y) { return (x < 0 || y < 0 || x >= this.w || y >= this.h) ? null : this.d[y * this.w + x]; }
  ell(cx, cy, rx, ry, c) {
    for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
      const dx = (x + .5 - cx) / rx, dy = (y + .5 - cy) / ry;
      if (dx * dx + dy * dy <= 1) this.set(x, y, typeof c === 'function' ? c(x, y) : c);
    }
  }
  rect(x, y, w, h, c) { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) this.set(i, j, c); }
  tri(ax, ay, bx, by, cx, cy, c) {
    const e = (px, py, qx, qy, rx, ry) => (qx - px) * (ry - py) - (qy - py) * (rx - px);
    const x0 = Math.floor(Math.min(ax, bx, cx)), x1 = Math.ceil(Math.max(ax, bx, cx));
    const y0 = Math.floor(Math.min(ay, by, cy)), y1 = Math.ceil(Math.max(ay, by, cy));
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      const px = x + .5, py = y + .5;
      const w0 = e(bx, by, cx, cy, px, py), w1 = e(cx, cy, ax, ay, px, py), w2 = e(ax, ay, bx, by, px, py);
      if ((w0 >= 0 && w1 >= 0 && w2 >= 0) || (w0 <= 0 && w1 <= 0 && w2 <= 0)) this.set(x, y, c);
    }
  }
  map(fn) { for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) { const c = this.get(x, y); if (c) this.d[y * this.w + x] = fn(x, y, c) || c; } }
  outline(col = OUT) {
    const add = [];
    for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++)
      if (!this.get(x, y) && (this.get(x - 1, y) || this.get(x + 1, y) || this.get(x, y - 1) || this.get(x, y + 1))) add.push([x, y]);
    add.forEach(([x, y]) => this.set(x, y, col));
  }
  // Soft volume: light from the top-left. Only pixels that belong to a region (share a colour with a
  // neighbour) are touched, so 1px details like eyes and noses keep their exact colour.
  autoShade() {
    const src = this.d.slice(), at = (x, y) => (x < 0 || y < 0 || x >= this.w || y >= this.h) ? null : src[y * this.w + x];
    for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
      const c = at(x, y); if (!c || c === OUT) continue;
      const u = at(x, y - 1), d = at(x, y + 1), l = at(x - 1, y), r = at(x + 1, y);
      if (u !== c && d !== c && l !== c && r !== c) continue;
      if (!u || (!l && u !== c)) this.d[y * this.w + x] = shade(c, 22);
      else if (!d || !r) this.d[y * this.w + x] = shade(c, -24);
    }
  }
  // Coloured outline: each outline pixel is a dark version of the colour it wraps (darker below than above).
  selOutline() {
    const add = [];
    for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
      if (this.get(x, y)) continue;
      const below = this.get(x, y + 1), n = below || this.get(x - 1, y) || this.get(x + 1, y) || this.get(x, y - 1);
      if (n) add.push([x, y, mixHex(n, OUT, below ? .55 : .75)]);
    }
    add.forEach(([x, y, c]) => this.set(x, y, c));
  }
  canvas() {
    const c = mk(this.w, this.h), x = c.getContext('2d');
    for (let j = 0; j < this.h; j++) for (let i = 0; i < this.w; i++) { const col = this.d[j * this.w + i]; if (col) { x.fillStyle = col; x.fillRect(i, j, 1, 1); } }
    return c;
  }
}
// outline: true = shaded sprite with coloured outline, 'plain' = flat dark outline (icons), false = none
function paint(w, h, fn, outline = true) {
  const G = new Grid(w, h); fn(G);
  if (outline === 'plain') G.outline(); else if (outline) { G.autoShade(); G.selOutline(); }
  return G.canvas();
}
function mixHex(a, b, t) {
  const p = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)], A = p(a), B = p(b);
  return '#' + A.map((v, i) => R(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join('');
}
function rows(rs, pal, outline = true) {
  return paint(rs[0].length + 2, rs.length + 2, G => rs.forEach((r, y) => [...r].forEach((ch, x) => { if (pal[ch]) G.set(x + 1, y + 1, pal[ch]); })), outline && 'plain');
}
function flipC(c) { const o = mk(c.width, c.height), x = o.getContext('2d'); x.translate(c.width, 0); x.scale(-1, 1); x.drawImage(c, 0, 0); return o; }
function tintC(c, col, a) {
  const o = mk(c.width, c.height), x = o.getContext('2d'); x.drawImage(c, 0, 0);
  x.globalCompositeOperation = 'source-atop'; x.globalAlpha = a === undefined ? 1 : a; x.fillStyle = col; x.fillRect(0, 0, c.width, c.height); return o;
}
function makeSpr(c) {
  const f = flipC(c);
  return { w: c.width, h: c.height, r: c, l: f, wr: tintC(c, '#ffffff'), wl: tintC(f, '#ffffff'), yr: tintC(c, '#fff27a'), yl: tintC(f, '#fff27a'),
           gr: tintC(c, '#ffd23f', .5), gl: tintC(f, '#ffd23f', .5), sil: tintC(c, '#3a2c40') };
}

// ============================================================ sprites: fish
function fishBasic(o) {
  return paint(o.w, o.h, G => {
    const cx = o.w * .56, cy = o.h / 2, rx = o.w * .34, ry = o.h * .36;
    G.tri(cx - rx + 2, cy, 1, 1, 1, o.h - 1, o.fin);
    G.tri(cx - rx * .6, cy - ry + 1.5, cx + rx * .35, cy - ry + 1.5, cx - rx * .35, 1, o.fin);
    G.tri(cx - rx * .2, cy + ry - 1, cx + rx * .2, cy + ry - 1, cx - rx * .3, o.h - 1.5, o.fin);
    G.ell(cx, cy, rx, ry, (x, y) => { const yy = y + .5; return yy > cy + ry * .3 ? o.belly : (o.back && yy < cy - ry * .35 ? o.back : o.body); });
    if (o.stripes) for (const f of o.stripes) {
      const sx = R(cx - rx + f * 2 * rx);
      for (let y = 0; y < o.h; y++) for (const x of [sx, sx + 1]) {
        const dx = (x + .5 - cx) / rx, dy = (y + .5 - cy) / ry;
        if (dx * dx + dy * dy <= 1) G.set(x, y, o.stripeCol);
      }
    }
    if (o.deco) o.deco(G, cx, cy, rx, ry);
    const ex = R(cx + rx * .55), ey = R(cy - ry * .3);
    G.set(ex, ey, OUT); if (o.w >= 16) G.set(ex - 1, ey, '#ffffff');
  });
}
function eelSpr(body, belly, fin, spot, glow) {
  return paint(30, 9, G => {
    G.ell(3.5, 4.5, 3, 1.6, body); G.rect(3, 3, 23, 3, body); G.ell(25, 4.5, 4, 3, body);
    G.rect(6, 2, 16, 1, fin); G.rect(4, 6, 20, 1, belly);
    for (let x = 7; x < 23; x += 4) { G.set(x, 4, spot); if (glow) G.set(x + 1, 3, glow); }
    G.set(26, 3, glow ? '#ffe14a' : OUT); G.set(28, 5, spot);
  });
}
const SPRITES = {
  // ---- 阳光浅滩
  clown: () => fishBasic({ w: 16, h: 10, body: '#ff8a2a', belly: '#ffb262', fin: '#ff7a1a', stripes: [.26, .6], stripeCol: '#fff6ee' }),
  sardine: () => fishBasic({ w: 14, h: 8, body: '#9cc0dc', back: '#4f7fab', belly: '#eef4f8', fin: '#6f98bf' }),
  bream: () => fishBasic({ w: 18, h: 12, body: '#ffd23f', back: '#f5a623', belly: '#fff0a8', fin: '#f08a1a' }),
  tang: () => fishBasic({ w: 17, h: 12, body: '#3a78ff', back: '#2450c8', belly: '#6fa0ff', fin: '#ffd23f',
    deco: (G, cx, cy, rx) => { for (let x = R(cx - rx * .6); x <= R(cx + rx * .2); x++) { const y = R(cy - 1 + (x - cx) * .25); G.set(x, y, '#12245a'); G.set(x, y + 1, '#12245a'); } } }),
  // ---- 彩虹珊瑚礁
  eel: () => eelSpr('#c9d64a', '#eef08a', '#8e9e2a', '#6d7a1c'),
  lion: () => paint(22, 16, G => {
    for (let i = 0; i < 5; i++) { const bx = 7 + i * 2.4; G.tri(bx, 7, bx + 2, 7, bx + .5 - i * .3, 1, i % 2 ? '#d9412b' : '#ffe8d6'); }
    G.tri(10, 10, 15, 10, 8, 15, '#e8604a'); G.tri(12, 10, 16, 10, 13, 15, '#ffe8d6');
    G.tri(7, 8.5, 1, 3, 1, 14, '#e8604a');
    G.ell(13, 8.5, 7, 4, (x, y) => x % 3 === 0 ? '#d9412b' : (y > 9 ? '#fff6ec' : '#ffe0cc'));
    G.set(18, 7, '#ffffff'); G.set(19, 7, OUT);
  }),
  turtle: () => paint(22, 14, G => {
    G.tri(13, 9, 17, 9, 19, 13, '#9ccf5e'); G.tri(4, 9, 7, 9, 1, 12, '#9ccf5e');
    G.ell(19, 6.5, 2.8, 2.3, '#9ccf5e');
    G.ell(10, 7, 8, 5.5, (x, y) => y > 9 ? '#e3d18e' : '#5aa84f');
    [[6, 5], [9, 4], [12, 5], [8, 7], [11, 7]].forEach(([x, y]) => { G.set(x, y, '#3b7a3a'); G.set(x + 1, y, '#3b7a3a'); });
    G.set(8, 3, '#8fd07a'); G.set(9, 3, '#8fd07a'); G.set(20, 6, OUT);
  }),
  parrot: () => fishBasic({ w: 20, h: 12, body: '#3ed6b0', back: '#2aa88a', belly: '#7ef0d0', fin: '#ff6fae', stripes: [.3, .56], stripeCol: '#ff9fce',
    deco: (G, cx, cy, rx) => { G.set(R(cx + rx), R(cy), '#f4f4f4'); G.set(R(cx + rx) - 1, R(cy) + 1, '#f4f4f4'); } }),
  // ---- 冰封海湾
  icefish: () => fishBasic({ w: 16, h: 9, body: '#dff4ff', back: '#a8d8f0', belly: '#ffffff', fin: '#bfe6f8',
    deco: (G, cx, cy) => { [[-2, 0], [1, 1], [-4, -1], [3, -1]].forEach(([dx, dy]) => G.set(R(cx + dx), R(cy + dy), '#8fc8e8')); } }),
  penguin: () => paint(21, 12, G => {
    G.tri(4, 6, 1, 3, 1, 9, '#ffb030');
    G.ell(10, 6, 7.5, 4, (x, y) => y > 6 ? '#ffffff' : '#2a2f45');
    G.ell(15.5, 5.5, 3, 3, '#2a2f45');
    G.rect(18, 6, 2, 1, '#ffb030');
    G.tri(8, 6, 13, 6, 10, 10, '#1b2035');
    G.set(16, 4, '#ffffff'); G.set(17, 4, OUT);
  }),
  narwhal: () => paint(32, 12, G => {
    G.tri(6, 6, 1, 2, 3, 6, '#8a98a8'); G.tri(6, 6, 3, 6, 1, 10, '#8a98a8');
    G.tri(12, 8, 16, 8, 11, 11, '#8a98a8');
    G.ell(14, 6.5, 10, 4, (x, y) => y > 7 ? '#d8e0e8' : '#9aa8b8');
    [[9, 4], [12, 5], [15, 4], [18, 5], [11, 6]].forEach(([x, y]) => G.set(x, y, '#6f7f90'));
    G.rect(24, 5, 7, 1, '#f4efe0'); for (let x = 25; x < 31; x += 2) G.set(x, 5, '#c8c0a8');
    G.set(20, 5, OUT);
  }),
  cod: () => fishBasic({ w: 18, h: 10, body: '#b8a878', back: '#8a7a50', belly: '#f0ead8', fin: '#9a8a60',
    deco: (G, cx, cy, rx) => { [[-3, -1], [0, -2], [2, 0], [-1, 0]].forEach(([dx, dy]) => G.set(R(cx + dx), R(cy + dy), '#7a6a40')); G.set(R(cx + rx) - 1, R(cy) + 3, '#7a6a40'); } }),
  // ---- 沉船墓场
  bonefish: () => paint(20, 11, G => {
    const B1 = '#f0ead8', B2 = '#c8bfa8';
    G.tri(4, 5.5, 1, 2, 1, 9, B2);
    G.rect(4, 5, 9, 1, B1);
    for (let x = 6; x < 13; x += 2) G.rect(x, 3, 1, 5, B1);
    G.ell(15.5, 5.5, 3.5, 3.5, B1);
    G.set(16, 4, '#7fffd4'); G.set(17, 4, OUT);
    G.rect(17, 7, 2, 1, B2);
  }),
  chest: () => paint(18, 13, G => {
    G.tri(4, 7, 1, 4, 1, 10, '#6fb8c8');
    G.rect(4, 5, 11, 7, '#8a5a2a');
    G.rect(4, 2, 11, 2, '#a86a32');
    G.rect(5, 4, 9, 1, '#ffe14a');
    G.rect(4, 5, 11, 1, '#ffd23f'); G.rect(9, 5, 1, 7, '#ffd23f'); G.set(9, 8, '#fff6c0');
    G.set(11, 4, OUT); G.set(13, 4, OUT);
    G.tri(9, 12, 13, 12, 11, 12.9, '#6fb8c8');
  }),
  octo: () => paint(16, 14, G => {
    for (let i = 0; i < 4; i++) { const x0 = 3 + i * 3; for (let y = 8; y < 13; y++) G.set(x0 + (y % 2 && i % 2 ? 1 : 0), y, '#ff8fb0'); G.set(x0 + 1, 12, '#ff8fb0'); }
    G.ell(8, 5.5, 5.5, 4.5, (x, y) => (x < 6 && y < 4) ? '#ffc0d4' : '#ff8fb0');
    G.set(6, 6, OUT); G.set(10, 6, OUT); G.set(5, 7, '#ff5a8a'); G.set(11, 7, '#ff5a8a');
  }),
  seahorse: () => paint(12, 17, G => {
    const C = '#ffb84a', D = '#e0902a';
    G.ell(7, 3.5, 2.5, 2.2, C); G.rect(8, 3, 3, 1, C);
    G.ell(5.5, 8, 3, 3.5, C);
    [[5, 11], [5, 12], [6, 13], [7, 14], [6, 15], [5, 15], [4, 14]].forEach(p => G.set(p[0], p[1], C));
    G.set(3, 6, D); G.set(3, 8, D); G.set(4, 10, D); G.set(6, 1, D);
    G.set(6, 8, '#ffd88a'); G.set(6, 9, '#ffd88a'); G.set(7, 3, OUT);
  }),
  // ---- 熔岩热泉
  armor: () => fishBasic({ w: 18, h: 11, body: '#6a5a58', back: '#4a3e3e', belly: '#9a8078', fin: '#e0602a', stripes: [.25, .5, .75], stripeCol: '#4a3e3e' }),
  ruby: () => fishBasic({ w: 15, h: 10, body: '#e8284a', back: '#b01838', belly: '#ff8aa0', fin: '#ff5a7a',
    deco: (G, cx, cy) => { G.set(R(cx - 2), R(cy - 1), '#ffffff'); G.set(R(cx + 1), R(cy + 1), '#ffd0da'); } }),
  lavaeel: () => eelSpr('#3a2a2a', '#5a3a30', '#2a1e1e', '#ff8a2a', '#ffd23f'),
  shrimp: () => paint(18, 11, G => {
    G.tri(3, 6, 1, 9, 4, 10, '#ff8a5a');
    [[5, 6, 2.5], [8, 5, 2.8], [11, 4.5, 3], [14, 5, 2.8]].forEach(([x, y, r], i) => G.ell(x, y, r, r * .9, i % 2 ? '#ff6a3a' : '#ff7f4a'));
    for (const x of [8, 10, 12]) G.set(x, 8, '#d84a2a');
    G.set(16, 3, '#ff6a3a'); G.set(17, 2, '#ff6a3a'); G.set(16, 2, '#ff6a3a');
    G.set(15, 4, OUT);
  }),
  // ---- 无光深渊
  angler: () => paint(22, 16, G => {
    G.tri(5, 9, 1, 4, 1, 14, '#3a3550');

    G.rect(17, 1, 2, 2, '#fff27a');
    G.rect(15, 11, 5, 1, OUT); G.set(16, 10, '#ffffff'); G.set(18, 10, '#ffffff'); G.set(17, 12, '#ffffff'); G.set(19, 12, '#ffffff');
    G.set(15, 7, '#ffffff'); G.set(16, 7, '#ff5a5a');
  }),
  sword: () => paint(34, 12, G => {
    G.tri(9, 6, 1, 1, 4, 6, '#2a4a8a'); G.tri(9, 6, 4, 6, 1, 11, '#2a4a8a');
    G.tri(11, 4, 20, 4, 12, .5, '#2a4a8a');
    G.ell(17, 6.5, 10, 3.6, (x, y) => y > 7 ? '#dbe8ff' : '#3a5fa8');

    for (let i = 0; i < 5; i++) { const x0 = 3 + i * 2; for (let y = 8; y < 17; y++) G.set(x0 + R(Math.sin(y * .8 + i) * .7), y, i % 2 ? '#c07ae8' : '#e4b5ff'); }
    G.ell(7, 6.5, 6, 5.5, (x, y) => y <= 8 ? (y < 4 && x < 6 ? '#fbe8ff' : '#d99bff') : null);
    G.rect(2, 8, 10, 1, '#b67ae0');

  oar: () => paint(38, 10, G => {
    G.rect(4, 2, 28, 1, '#e8453c');
    G.tri(33, 3, 36, .5, 31, .5, '#e8453c');
    G.ell(19, 5.5, 17, 2.8, (x, y) => y > 5 ? '#f4f6fa' : '#c9d0dc');
    for (let x = 6; x < 32; x += 3) G.set(x, 5, '#8a93a6');
    G.set(33, 4, OUT);
  }),
};

// ============================================================ species, zones, bosses
// buff: which run stat it improves. lvl 2 = stronger version. cm = typical size.
const SP = {

function bands(x, y0, y1, cols) {
  const n = cols.length, h = (y1 - y0) / n;
  for (let i = 0; i < n; i++) { x.fillStyle = cols[i]; x.fillRect(0, R(y0 + i * h), W, Math.ceil(h) + 1); }
  for (let i = 1; i < n; i++) {
    const by = R(y0 + i * h); x.fillStyle = cols[i - 1];
    for (let px = 0; px < W; px++) { if (px % 2 === 0) x.fillRect(px, by, 1, 1); if (px % 4 === 1) x.fillRect(px, by + 1, 1, 1); }
  }
}
function thickLine(x, x0, y0, x1, y1, w, col) {
  const n = Math.ceil(Math.hypot(x1 - x0, y1 - y0)); x.fillStyle = col;
  for (let i = 0; i <= n; i++) { const t = n ? i / n : 0; x.fillRect(R(lerp(x0, x1, t) - w / 2), R(lerp(y0, y1, t)), w, w); }
}
function branch(x, px, py, a, len, d, col) {
  const x2 = px + Math.cos(a) * len, y2 = py + Math.sin(a) * len;
  thickLine(x, px, py, x2, y2, d > 1 ? 2 : 1, col);
  if (d > 0) { branch(x, x2, y2, a - rand(.3, .6), len * .75, d - 1, col); branch(x, x2, y2, a + rand(.3, .6), len * .75, d - 1, col); }
  else { x.fillStyle = '#ffffff'; x.globalAlpha = .5; x.fillRect(R(x2), R(y2), 1, 1); x.globalAlpha = 1; }
}

// ---------- service
// The café is an isometric cut-away shop on a pier, rendered on its own 360x640 canvas (twice the game's
// resolution); its menus are drawn on the normal 180x320 layer on top.
const CW2 = 288, CH2 = 512, cafeCanvas = mk(CW2, CH2), CG = cafeCanvas.getContext('2d');
const ISO = { ox: 144, oy: 196, n: 8, wh: 96 };
const CS = W / CW2; // café pixel -> game pixel
const isoPt = (i, j) => [ISO.ox + (i - j) * 16, ISO.oy + (i + j) * 8];
const isoC = (i, j) => isoPt(i + .5, j + .5);
const TABLES = [[3, 3], [5, 3], [3, 5], [5, 5], [6.8, 4.2]];
const DOOR = isoPt(8.3, 7.4), OUTSIDE = isoPt(10.6, 7.6);
function tankFish() {
  const score = k => (DEX.fish[k].shiny ? 4 : 0) + (DEX.fish[k].gold ? 2 : 0);
  return FISH_ORDER.filter(k => DEX.fish[k]).sort((a, b) => score(b) - score(a));
}
const cafe = { page: 0, sheet: 0, back: 'title', svc: false, cust: [], spawnT: 0, earned: 0, slot: 0, prev: null, detail: null, chefT: 0 };
const seatCount = eq => decoItem('seat', (eq || CAFE.deco.eq).seat).seats;
const seatPos = k => { const [cx, cy] = isoC(...TABLES[k]); return [cx - 9, cy - 5]; };
const arriveGap = () => 1.3 / (1 + (charm(CAFE.deco.eq) + Math.min(60, CAFE.pop / 2)) / 30);
function nextDish() {
  const avail = DISH_KEYS.filter(k => stockOf(k) > 0);
  if (!avail.length) return null;
  const k = pick(avail), d = DISH[k];
  let prem = false;
  if (d.boss) CAFE.boss[d.boss]--;
  else { const c = CAFE.cooler[k]; prem = c.p > 0; c.n--; if (prem) c.p--; }
  CAFE.sold[k] = (CAFE.sold[k] || 0) + 1;
  return { k, price: d.price * (prem ? 2 : 1), prem };
}
function openCafe(from) { cafe.back = from; cafe.cust = []; cafe.svc = false; cafe.detail = null; cafe.prev = null; cafe.sheet = totalStock() ? 0 : null; go('cafe'); SFX.click(); }
function updCafe(dt) {
  cafe.chefT = Math.max(0, cafe.chefT - dt);
  if (!cafe.svc) return;
  cafe.spawnT -= dt;
  const n = seatCount(), used = cafe.cust.map(c => c.seat);
  if (cafe.spawnT <= 0 && cafe.cust.length < n) {
    const d = nextDish();
    if (d) {
      let seat = 0; while (used.includes(seat)) seat++;
      cafe.cust.push({ seat, look: newGuestLook(), t: 0, ph: 'in', d, x: OUTSIDE[0], y: OUTSIDE[1], path: [DOOR, seatPos(seat)] });
      cafe.spawnT = arriveGap(); saveCafe();
    }
  }
  for (let i = cafe.cust.length - 1; i >= 0; i--) {
    const c = cafe.cust[i]; c.t += dt; if (c.heart > 0) c.heart -= dt;
    if (c.ph === 'eat') {
      if (c.t > (c.look.size === 'l' ? 1.8 : 1.3)) {
        const mult = decoItem('stove', CAFE.deco.eq.stove).mult * (c.look.size === 'l' ? 1.3 : 1);
        const v = R(c.d.price * mult); earn(v); cafe.earned += v;
        pop('+' + v, c.x * CS, c.y * CS - 22, '#ffe14a', 9, .9); SFX.coin();
        c.ph = 'out'; c.path = [DOOR, OUTSIDE]; c.heart = 1;
      }
      continue;
    }
    // walk along the path
    let step = 80 * dt;
    while (step > 0 && c.path.length) {
      const [tx, ty] = c.path[0], dx = tx - c.x, dy = ty - c.y, d = Math.hypot(dx, dy);
      if (d <= step) { c.x = tx; c.y = ty; step -= d; c.path.shift(); } else { c.x += dx / d * step; c.y += dy / d * step; c.face = dx < 0 ? -1 : 1; step = 0; }

// Big always-on action bar during bites and fights: what to do right now, in two words and a hand.

  } else {

function render() {
  if (state === 'cafe') { renderCafe(); return; }
  TQ.length = 0;
  const z = Z();
  g.imageSmoothingEnabled = false; g.globalAlpha = 1;
  g.drawImage(getBg(curZone()), 0, 0);
  drawSky(z); drawShafts(z); drawWeeds(z);
  for (const f of decor) drawFishAt(f.key, f.x, f.y, f.vx > 0 ? 1 : -1);
  if (B) drawBoss();
  if (biter) drawFishAt(biter.key, biter.x, biter.y, biter.face, biter.shiny ? 'g' : null);
  if (F) drawFight();
  drawCat(); drawRodLine(); drawSurface(z); drawFog(z);
  drawParts(); drawInk(); drawBolt();
  if (state === 'leap' && leap) drawLeap();
  drawHUD(z);
  if (state !== 'cafe') g.drawImage(muted ? I.mute : I.sound, 168, 3);
  drawOverlay(z);
  for (const p of POPS) txt(p.s, p.x, p.y, p.size, p.col, 'center', OUT, Math.min(1, p.life / p.max * 2));
  if (flash > 0) { g.globalAlpha = Math.min(.4, flash * .5); g.fillStyle = '#ffffff'; g.fillRect(0, 0, W, H); g.globalAlpha = 1; }

  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.imageSmoothingEnabled = false; ctx.globalAlpha = 1;
  ctx.fillStyle = '#0b1020'; ctx.fillRect(0, 0, cv.width, cv.height);
  const amp = Math.min(shake, 4) * .6, sx = amp > 0 ? R(Math.sin(T * 38) * amp) : 0, sy = amp > 0 ? R(Math.cos(T * 31) * amp) : 0;
  ctx.drawImage(low, 0, 0, W, H, sx * K, sy * K, W * K, H * K);
  for (const t of TQ) {
    const c = textSprite(t), tw = c.w - 2 * c.pad;
    const dx = t.x * K - c.pad - (t.align === 'center' ? tw / 2 : t.align === 'right' ? tw : 0);
    ctx.globalAlpha = t.alpha; ctx.drawImage(c.cv, R(dx + sx * K), R(t.y * K - c.h / 2 + sy * K));
  }

}
// Outlined text, rendered once per (text, size, colours, scale) and reused. The outline is the glyphs
// stamped around a circle rather than strokeText, so it always hugs the fill with no hairline gap.
const TXC = new Map();
function textSprite(t) {
  const key = t.s + '|' + t.size + '|' + t.col + '|' + t.stroke + '|' + K;
  let c = TXC.get(key); if (c) return c;
  if (TXC.size > 400) TXC.clear();
  const m = document.createElement('canvas'), x = m.getContext('2d'), font = t.size * K + 'px ' + FONT;
  const r = t.stroke ? Math.max(.75, t.size * .14) * K : 0, pad = Math.ceil(r) + 2;
  x.font = font;
  m.width = Math.ceil(x.measureText(t.s).width) + pad * 2; m.height = Math.ceil(t.size * K * 1.5) + pad * 2;
  x.font = font; x.textBaseline = 'middle'; x.textAlign = 'left';
  const oy = m.height / 2;
  if (t.stroke) {
    x.fillStyle = t.stroke;
    for (const f of [1, .55]) for (let k = 0; k < 16; k++) { const a = k / 16 * Math.PI * 2; x.fillText(t.s, pad + Math.cos(a) * r * f, oy + Math.sin(a) * r * f); }
  }
  x.fillStyle = t.col; x.fillText(t.s, pad, oy);
  c = { cv: m, w: m.width, h: m.height, pad }; TXC.set(key, c); return c;
}
// glyphs rendered before the web font arrived must be redrawn with it
try { if (document.fonts) { document.fonts.addEventListener('loadingdone', () => TXC.clear()); document.fonts.ready.then(() => TXC.clear()); } } catch (e) {}

}
