// ============================================================ pixel painter
class Grid {
  constructor(w, h) { this.w = w; this.h = h; this.d = new Array(w * h).fill(null); }

  get(x, y) { return (x < 0 || y < 0 || x >= this.w || y >= this.h) ? null : this.d[y * this.w + x]; }

    G.tri(cx - rx * .2, cy + ry - 1, cx + rx * .2, cy + ry - 1, cx - rx * .3, o.h - 1.5, o.fin);
    G.ell(cx, cy, rx, ry, (x, y) => { const yy = y + .5; return yy > cy + ry * .3 ? o.belly : (o.back && yy < cy - ry * .35 ? o.back : o.body); });

// ---- boss painting kit: lit colour ramps with ordered dither, rayed fins, glossy eyes
const DITHER = [[0, .5], [.75, .25]];
const noise2 = (x, y, s = 0) => { let h = Math.imul(x + 101, 374761393) ^ Math.imul(y + 57, 668265263) ^ Math.imul(s + 7, 982451653); h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
// colour picker for a rounded body lit from above: pal runs dark -> light, belly takes over below `bl`
function lit(pal, cx, cy, rx, ry, o = {}) {
  const lx = o.lx === undefined ? .2 : o.lx, bl = o.bl === undefined ? .4 : o.bl, base = o.base === undefined ? .6 : o.base;
  return (x, y) => {
    const nx = (x + .5 - cx) / rx, ny = (y + .5 - cy) / ry, rr = nx * nx + ny * ny;
    const p = o.belly && ny > bl ? o.belly : pal;
    const v = base - ny * .5 + nx * lx - Math.max(0, rr - .65) * .7 + (DITHER[y & 1][x & 1] - .375) * .09;
    return p[clamp(Math.floor(v * p.length), 0, p.length - 1)];
  };
}
function fillLit(G, key, fn) { G.map((x, y, c) => c === key ? fn(x, y) : c); }
function gLine(G, x0, y0, x1, y1, c, only) {
  const n = Math.max(1, Math.ceil(Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0))));
  for (let i = 0; i <= n; i++) { const x = R(x0 + (x1 - x0) * i / n), y = R(y0 + (y1 - y0) * i / n); if (!only || G.get(x, y)) G.set(x, y, c); }
}
function gThick(G, x0, y0, x1, y1, w, c) { for (let dy = 0; dy < w; dy++) for (let dx = 0; dx < w; dx++) gLine(G, x0 + dx, y0 + dy, x1 + dx, y1 + dy, c); }
function gDel(G, x, y) { if (x >= 0 && y >= 0 && x < G.w && y < G.h) G.d[y * G.w + x] = null; }
// fin: a = root, b-c = outer edge; pal = [ray, membrane, edge]
function finG(G, ax, ay, bx, by, cx, cy, pal, n = 3) {
  G.tri(ax, ay, bx, by, cx, cy, pal[1]);
  gLine(G, bx, by, cx, cy, pal[2], true);
  for (let i = 1; i <= n; i++) { const t = i / (n + 1); gLine(G, ax, ay, bx + (cx - bx) * t, by + (cy - by) * t, pal[0], true); }
}
function eyeG(G, x, y, r, iris, pupil = 'round') {
  G.ell(x, y, r + 1, r + 1, OUT);
  G.ell(x, y, r, r, (px, py) => py + .5 > y + r * .25 ? shade(iris, -34) : iris);
  if (pupil === 'slit') G.rect(R(x - .5), R(y - r * .7), 1, Math.max(2, R(r * 1.4)), OUT);
  else if (pupil === 'bar') G.rect(R(x - r * .6), R(y - .5), Math.max(2, R(r * 1.2)), 1, OUT);
  else if (pupil === 'round') G.ell(x + .3, y + .2, Math.max(.8, r * .45), Math.max(.8, r * .5), OUT);
  const hx = R(x - r * .5), hy = R(y - r * .5);
  G.set(hx, hy, '#ffffff'); if (r >= 3) { G.set(hx + 1, hy, '#ffffff'); G.set(hx, hy + 1, '#ffffff'); }
}

// Big always-on action bar during bites and fights: what to do right now, in two words and a hand.

  TQ.length = 0;

  if (F) drawFight();

  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.imageSmoothingEnabled = false; ctx.globalAlpha = 1;
  ctx.fillStyle = '#0b1020'; ctx.fillRect(0, 0, cv.width, cv.height);
  const amp = Math.min(shake, 4) * .6, sx = amp > 0 ? R(Math.sin(T * 38) * amp) : 0, sy = amp > 0 ? R(Math.cos(T * 31) * amp) : 0;
  ctx.drawImage(low, 0, 0, W, H, sx * K, sy * K, W * K, H * K);
  for (const t of TQ) {
    const c = textSprite(t), tw = c.w - 2 * c.pad;
    const dx = t.x * K - c.pad - (t.align === 'center' ? tw / 2 : t.align === 'right' ? tw : 0);

// Outlined text, rendered once per (text, size, colours, scale) and reused. The outline is the glyphs
// stamped around a circle rather than strokeText, so it always hugs the fill with no hairline gap.
const TXC = new Map();
function textSprite(t) {
  const key = t.s + '|' + t.size + '|' + t.col + '|' + t.stroke + '|' + K;
  let c = TXC.get(key); if (c) return c;
  if (TXC.size > 400) TXC.clear();
  // Center the visible glyph bounds rather than the font line box, so small signs do not clip.
  const m = mk(1, 1), x = m.getContext('2d'), font = t.size * K + 'px ' + FONT;
  const r = t.stroke ? Math.max(.75, t.size * .14) * K : 0, pad = Math.ceil(r) + 2;
  x.font = font;
  const metrics = x.measureText(String(t.s)), ascent = Math.ceil(metrics.actualBoundingBoxAscent || t.size * K), descent = Math.ceil(metrics.actualBoundingBoxDescent || 0);
  m.width = Math.max(1, Math.ceil(metrics.width) + pad * 2); m.height = ascent + descent + pad * 2;
  x.font = font; x.textBaseline = 'alphabetic'; x.textAlign = 'left';
  const oy = pad + ascent;
  if (t.stroke) {
    x.fillStyle = t.stroke;
    for (const f of [1, .55]) for (let k = 0; k < 16; k++) { const a = k / 16 * Math.PI * 2; x.fillText(t.s, pad + Math.cos(a) * r * f, oy + Math.sin(a) * r * f); }

  x.fillStyle = t.col; x.fillText(t.s, pad, oy);

}
